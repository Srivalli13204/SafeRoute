services:
  - type: web
    name: saferoute
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: ./startup.sh

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saferoute-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: PYTHON_VERSION
        value: 3.12

databases:
  - name: saferoute-db
    plan: free
    databaseName: saferoute
    user: saferoute_user